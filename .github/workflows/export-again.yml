name: Export AGAIN VPS Clips
on:
  push:
    paths:
      - '.github/workflows/export-again.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode clips
        run: |
          base64 -d AGAIN_shot01.b64 > AGAIN_shot01.mp4
          base64 -d AGAIN_shot02.b64 > AGAIN_shot02.mp4
          ls -lh AGAIN_shot01.mp4 AGAIN_shot02.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: again-vps-clips
          path: |
            AGAIN_shot01.mp4
            AGAIN_shot02.mp4
          retention-days: 1
